<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="menu.js"></script>
<script>
  function formatDate(d) {
    const date = new Date(d);
    return `${date.getFullYear()}. ${date.getMonth() + 1}. ${date.getDate()}`;
  }
  async function loadBulletins() {
    const list = document.getElementById('bulletin-list');
    const { data: bulletins, error } = await sb.from('bulletins').select('*').order('bulletin_date', { ascending: false });
    if (error || !bulletins || bulletins.length === 0) {
      list.innerHTML = '<p class="empty-state">아직 등록된 주보가 없습니다.</p>';
      return;
    }
    list.innerHTML = bulletins.map(b => `
      <div class="bulletin-item">
        <div class="date">${formatDate(b.bulletin_date)}</div>
        <h3>${b.title}</h3>
        ${b.description ? `<p>${b.description}</p>` : ''}
        ${b.file_url ? `<a class="file-link" href="${b.file_url}" target="_blank" rel="noopener">주보 파일 보기 →</a>` : ''}
      </div>
    `).join('');
  }
  loadBulletins();
</script>
