<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="description" content="청주 온누리감리교회 부서별 소개 페이지입니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%9D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700;800&family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">

</head>
<body>

<header>
  <a class="brand" href="index.html">청주 온누리감리교회</a>
  <nav id="site-nav" class="site-nav"></nav>
  <div class="header-actions">
    <a class="admin-link-header" href="admin/">관리자</a>
    <button id="sitemap-btn" class="hamburger-btn" aria-label="전체 사이트맵 열기"><span></span><span></span><span></span></button>
  </div>
</header>

<div id="sitemap-modal" class="sitemap-modal" hidden>
  <div class="sitemap-modal-inner">
    <button id="sitemap-close" class="sitemap-close" aria-label="닫기">✕</button>
    <div id="sitemap-grid" class="sitemap-grid"></div>
  </div>
</div>

<div id="mobile-drawer" class="mobile-drawer" hidden>
  <div class="mobile-drawer-panel">
    <button id="drawer-close" class="sitemap-close" aria-label="닫기">✕</button>
    <div id="drawer-accordion" class="drawer-accordion"></div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="index.html#worship" class="bottom-nav-item"><span class="icon">🙏</span><span>예배</span></a>
    <a href="index.html#sermons" class="bottom-nav-item"><span class="icon">📖</span><span>설교</span></a>
    <a href="gallery.html" class="bottom-nav-item" data-page="gallery.html"><span class="icon">🖼️</span><span>앨범</span></a>
    <a href="bulletins.html" class="bottom-nav-item" data-page="bulletins.html"><span class="icon">📰</span><span>주보</span></a>
    <button type="button" class="bottom-nav-item" id="bottom-nav-more"><span class="icon">☰</span><span>더보기</span></button>
  </div>
</nav>

<div class="page-hero" id="dept-hero">
  <h1 id="dept-name">부서 소개</h1>
  <p id="dept-leader"></p>
</div>

<section>
  <p class="section-sub" id="dept-description" style="max-width:640px;margin:0 auto 2.5rem"></p>
  <h2 class="section-title">부서 앨범</h2>
  <p class="section-sub">이 부서의 활동 사진을 모아봤어요</p>
  <div class="gallery-grid" id="dept-gallery">
    <p class="empty-state">사진을 불러오는 중입니다...</p>
  </div>
</section>

<footer>
  <strong>청주 온누리감리교회</strong><br>
  충북 청주시 서원구 성봉로 194 (개신동) · Tel. 043-265-1825, 266-1825<br>
  © 2026 Onnuri Methodist Church. All rights reserved.<br>
  <a class="admin-link" href="admin/">관리자</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="menu.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || '유치부';

  async function loadDepartment() {
    const { data: dept } = await sb.from('departments').select('*').eq('slug', slug).single();
    if (dept) {
      document.title = `${dept.name} - 청주 온누리감리교회`;
      document.getElementById('dept-name').textContent = dept.name;
      document.getElementById('dept-leader').textContent = dept.leader_name ? `담당: ${dept.leader_name}` : '';
      document.getElementById('dept-description').textContent = dept.description;
      if (dept.banner_image) {
        document.getElementById('dept-hero').style.background = `linear-gradient(180deg, rgba(8,13,22,0.55), rgba(8,13,22,0.8)), url('${dept.banner_image}') center/cover no-repeat`;
      }
    } else {
      document.getElementById('dept-name').textContent = slug;
    }

    const grid = document.getElementById('dept-gallery');
    const { data: photos } = await sb.from('photos').select('*').eq('department', slug).order('sort_order').order('created_at', { ascending: false });
    if (!photos || photos.length === 0) {
      grid.innerHTML = '<p class="empty-state">아직 등록된 사진이 없습니다.</p>';
      return;
    }
    grid.innerHTML = photos.map(p => `
      <figure>
        <img src="${p.url}" alt="${p.caption || dept ? dept.name : slug}" loading="lazy">
        ${p.caption ? `<figcaption>${p.caption}</figcaption>` : ''}
      </figure>
    `).join('');
  }
  loadDepartment();
</script>

</body>
</html>
