<section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="menu.js"></script>
<script>
  let allEvents = [];
  let currentMonth = new Date();
  currentMonth.setDate(1);
  let selectedDateKey = null;

  function dateKey(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  function renderCalendar() {
    const y = currentMonth.getFullYear();
    const m = currentMonth.getMonth();
    document.getElementById('cal-title').textContent = `${y}년 ${m + 1}월`;

    const firstWeekday = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const todayKey = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

    const eventDays = new Set(allEvents.map(e => e.event_date));

    let cells = '';
    for (let i = 0; i < firstWeekday; i++) cells += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const weekday = new Date(y, m, d).getDay();
      const classes = ['cal-cell'];
      if (weekday === 0) classes.push('sun');
      if (weekday === 6) classes.push('sat');
      if (key === todayKey) classes.push('today');
      if (key === selectedDateKey) classes.push('selected');
      const dot = eventDays.has(key) ? '<span class="cal-dot"></span>' : '';
      cells += `<button type="button" class="${classes.join(' ')}" data-key="${key}">${d}${dot}</button>`;
    }
    document.getElementById('calendar-grid').innerHTML = cells;

    document.querySelectorAll('.cal-cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', () => {
        selectedDateKey = cell.dataset.key === selectedDateKey ? null : cell.dataset.key;
        renderCalendar();
        renderSchedulePanel();
      });
    });
  }

  function formatEventDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return `${y}. ${m}. ${d}`;
  }

  function renderSchedulePanel() {
    const title = document.getElementById('schedule-panel-title');
    const list = document.getElementById('schedule-list');

    let items;
    if (selectedDateKey) {
      title.textContent = `${formatEventDate(selectedDateKey)} 일정`;
      items = allEvents.filter(e => e.event_date === selectedDateKey);
    } else {
      title.textContent = '다가오는 일정';
      const todayKey = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
      items = allEvents.filter(e => e.event_date >= todayKey).slice(0, 5);
    }

    if (!items.length) {
      list.innerHTML = '<p class="empty-state">예정된 일정이 없습니다.</p>';
      return;
    }
    list.innerHTML = items.map(e => `
      <div class="schedule-item">
        <div class="schedule-item-date">${formatEventDate(e.event_date)}${e.event_time ? ' · ' + e.event_time : ''}</div>
        <h4>${e.title}</h4>
        ${e.location ? `<div class="schedule-item-location">📍 ${e.location}</div>` : ''}
        ${e.description ? `<p>${e.description}</p>` : ''}
      </div>
    `).join('');
  }

  async function loadEvents() {
    const { data } = await sb.from('events').select('*').order('event_date');
    allEvents = data || [];
    renderCalendar();
    renderSchedulePanel();
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    currentMonth.setMonth(currentMonth.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    currentMonth.setMonth(currentMonth.getMonth() + 1);
    renderCalendar();
  });

  loadEvents();
</script>
